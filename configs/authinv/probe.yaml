# Phase-5 probing tooling (P5.1; scripts/authinv_probe.py; src/authinv/probe/). Optional phase.
# Models, world subset, layers and labels are frozen by docs/prereg/phase5.md (P5.2); a change is an amendment.
experiment: authinv_p5_probing
dataset_sha256: 0b602a1701bc52aaaf676973f24ea87b1e27acd9029f5e0523174d51894a4f83   # benchmark v2 (P1.13)
tasks: [application, interpretation]
worlds: 400              # hash-selected benchmark worlds (all six renderings, both assignments); "all" = 1,984
world_seed: 20261115
owner_slots: 5           # owner_<k> labels for the first k principals in the facts list
layers: {stride: 2}      # hidden-state indices (0 = embeddings); "all" or a list also work
dtype: bfloat16
batch_size: 16
# ~35k items x ~20 layers x hidden 4096 x float16 is ~6 GB per model at these settings
labels: [allow_deny, governing, owner_0, owner_1, owner_2, owner_3, owner_4]
probe:
  l2: 1.0
  max_iter: 500
  test_fraction: 0.3     # held-out worlds (split by world)
  split_seed: 20261115
  bootstrap_replicates: 2000   # over test worlds
