# P2.9: the frozen Phase-2 run set behind the headline tables and figures
# (scripts/authinv_figures.py). Paths are relative to the repo root. The runs
# themselves are git-ignored; the P2.4-P2.8 reports name their V100 archives.
experiment: authinv_phase2_figures
dataset_sha256: 0b602a1701bc52aaaf676973f24ea87b1e27acd9029f5e0523174d51894a4f83
t2_config: configs/authinv/t2.yaml   # every T2 run must carry this config's hash
# Permutation seeds for the Spearman tests: each tier's preregistered analysis seed
# (t2.yaml bootstrap_seed; phase2-t3.md uses 20261013).
seeds: {t1: 20261010, t2: 20261010, t3: 20261013}
permutations: 20000     # docs/prereg/phase2.md, Q4
alpha: 0.05             # Holm family level (docs/prereg/phase2.md, phase2-t3.md)
expected_rows: {t2: 172296, t1: 95232, t3: 95232}
quantization_pair: [qwen3_8_27b, qwen3_8_27b_fp8]
# Q4 is reported a second time without these (they duplicate the 27B base; descriptive).
scaling_descriptive_exclude: [qwen3_8_27b_fp8, qwen3_8_27b_thinking]
