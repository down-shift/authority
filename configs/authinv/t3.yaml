experiment: authinv_t3_agent_sandbox
seed: 20261013
dataset_sha256: 0b602a1701bc52aaaf676973f24ea87b1e27acd9029f5e0523174d51894a4f83   # benchmark v2 (P1.13), as T2
agent_version: agent-v2
