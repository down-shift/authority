[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authority-leakage"
version = "0.1.0"
description = "Controlled tests of cross-type and cross-scope authority leakage"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2", "scipy>=1.10", "matplotlib>=3.7", "PyYAML>=6", "torch>=2", "transformers>=4.45"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
