[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authority-leakage"
version = "0.1.0"
description = "Matched behavioral experiments on authorization representation invariance"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2", "scipy>=1.10", "matplotlib>=3.7", "PyYAML>=6", "tqdm>=4.66"]

[project.optional-dependencies]
inference = ["torch>=2.1.1", "transformers>=4.51.0"]
quantization = ["bitsandbytes>=0.45"]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.6"]
# authinv extras (RESEARCH_PLAN §5). vLLM is deliberately not locked here: it
# pins its own torch, so generation runs use the pinned vllm/vllm-openai image
# (H100) or a separate venv with the same vllm version (A100); the runner
# records the version it ran with.
engines = ["cedarpy==4.12.1"]  # Cedar (Rust engine via PyO3); OPA is a pinned binary (P1.5)
probing = ["scikit-learn>=1.4"]
agent = []  # sandbox deps, filled by P2.7

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
